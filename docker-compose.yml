services:
  mysql:
    image: mysql:8.0
    container_name: my_mysql8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: schoolmanagement
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./query/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    container_name: my_spring_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Choose profile here: local OR staging
      SPRING_PROFILES_ACTIVE: local

      # DB connection for the app (use mysql service name as host)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/schoolmanagement?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: appuser
      SPRING_DATASOURCE_PASSWORD: apppass

volumes:
  mysql_data:
